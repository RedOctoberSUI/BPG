  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=EB+Garamond:ital,wght@0,400;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #f3e3c3;
      --surface:    #fdf8ee;
      --ink:        #2b1c10;
      --ink-soft:   #6e5a42;
      --gold:       #7a5220;
      --gold-mid:   #a3752f;
      --gold-light: #f7ecd6;
      --border:     #e3cd9c;
      --radius:     2px;
    }

    html, body { height: 100%; color: var(--ink); font-family: 'Jost', sans-serif; font-weight: 300; }

    body {
      background:
        radial-gradient(circle at 12% 8%,  rgba(255,255,255,0.55) 0px, rgba(255,255,255,0.55) 3px, transparent 4px),
        radial-gradient(circle at 28% 4%,  rgba(255,255,255,0.4) 0px, rgba(255,255,255,0.4) 5px, transparent 6px),
        radial-gradient(circle at 46% 12%, rgba(255,255,255,0.5) 0px, rgba(255,255,255,0.5) 3px, transparent 4px),
        radial-gradient(circle at 64% 6%,  rgba(255,255,255,0.35) 0px, rgba(255,255,255,0.35) 6px, transparent 7px),
        radial-gradient(circle at 82% 10%, rgba(255,255,255,0.5) 0px, rgba(255,255,255,0.5) 4px, transparent 5px),
        radial-gradient(circle at 93% 20%, rgba(255,255,255,0.4) 0px, rgba(255,255,255,0.4) 3px, transparent 4px),
        radial-gradient(circle at 6% 30%,  rgba(255,255,255,0.4) 0px, rgba(255,255,255,0.4) 4px, transparent 5px),
        radial-gradient(circle at 20% 45%, rgba(255,255,255,0.3) 0px, rgba(255,255,255,0.3) 6px, transparent 7px),
        radial-gradient(circle at 90% 45%, rgba(255,255,255,0.35) 0px, rgba(255,255,255,0.35) 5px, transparent 6px),
        radial-gradient(circle at 8% 65%,  rgba(255,255,255,0.35) 0px, rgba(255,255,255,0.35) 4px, transparent 5px),
        radial-gradient(circle at 94% 68%, rgba(255,255,255,0.4) 0px, rgba(255,255,255,0.4) 4px, transparent 5px),
        radial-gradient(circle at 15% 85%, rgba(255,255,255,0.3) 0px, rgba(255,255,255,0.3) 5px, transparent 6px),
        radial-gradient(circle at 85% 88%, rgba(255,255,255,0.35) 0px, rgba(255,255,255,0.35) 4px, transparent 5px),
        radial-gradient(circle at 50% 95%, rgba(255,255,255,0.3) 0px, rgba(255,255,255,0.3) 5px, transparent 6px),
        radial-gradient(ellipse at 50% 0%, rgba(255,247,220,0.9) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 100%, #e8c887 0%, transparent 60%),
        linear-gradient(180deg, #f7e6bd 0%, #f0d9a3 45%, #e8c887 100%);
      background-attachment: fixed;
    }

    .stage {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 3rem 2.5rem;
      width: 100%; max-width: 460px;
      text-align: center;
      box-shadow: 0 2px 24px rgba(45,74,48,0.08);
      position: relative;
      animation: fadeUp 0.5s ease both;
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }

    .card::before, .card::after {
      content: ''; position: absolute; width: 16px; height: 16px;
      border-color: var(--gold); border-style: solid; opacity: 0.3;
    }
    .card::before { top: 10px; left: 10px; border-width: 1px 0 0 1px; }
    .card::after  { bottom: 10px; right: 10px; border-width: 0 1px 1px 0; }

    .big-emoji { font-size: 2.5rem; margin-bottom: 1.2rem; }

    .eyebrow {
      font-size: 0.65rem; font-weight: 500; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--gold); margin-bottom: 0.6rem;
    }

    h1 {
      font-family: 'Playfair Display', serif; font-size: 1.7rem; font-weight: 400;
      color: var(--ink); line-height: 1.25; margin: 0;
    }
    h1.line2 { margin: 0.2rem 0 0.8rem; }

    .ornament {
      display: flex; align-items: center; gap: 0.75rem; margin: 1.4rem 0; color: var(--gold-mid);
    }
    .ornament::before, .ornament::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .ornament-inner { font-size: 0.65rem; letter-spacing: 0.3em; }

    .subtitle {
      font-family: 'EB Garamond', serif; font-size: 1.05rem; color: var(--ink-soft); line-height: 1.6;
    }

    .version-tag { position: fixed; bottom: 0.7rem; right: 0.9rem; font-size: 0.6rem; color: var(--border); letter-spacing: 0.1em; }
    .pw-footer { margin-top: 1.6rem; font-size: 0.6rem; letter-spacing: 0.1em; color: var(--border); }

    @media (max-width: 520px) { .card { padding: 2.2rem 1.5rem; } h1 { font-size: 1.4rem; } }
  </style>
</head>
<body>
<div class="stage">
  <div class="card">
    <div class="big-emoji">🍺</div>
    <div class="eyebrow">30 Jahre Philipp G.</div>
    <h1>Aus und vorbei</h1>
    <h1 class="line2">fertig ist die Glarnerei!</h1>
    <div class="ornament"><span class="ornament-inner">✦</span></div>
    <p class="subtitle">Danke fürs Feiern, danke fürs Bier.<br>Bis zum nächsten Mal. 🍻</p>
    <div class="pw-footer">CLv0.043 · © Pippos Lustige Hundeshow</div>
  </div>
</div>
<div class="version-tag">CLv0.043</div>
</body>
</html>
